name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, vet, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No secrets are needed. Every test runs offline against the fixture reader
    # and a Responder seam, so this job would fail loudly if one ever started
    # needing a credential.
    env:
      GOOGLE_API_KEY: ""

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build
